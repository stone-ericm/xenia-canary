# Fork-only verification workflow (NOT part of any upstream PR).
# Upstream CI builds with XENIA_BUILD_TESTS off and runs no tests, so this
# builds xenia-kernel-tests and runs the [apc] cases on Windows and Linux.
# Setup steps are copied from Windows_x86.yml / Linux_x86.yml.
name: Fork APC tests

on:
  push:

jobs:
  windows:
    name: Windows kernel tests
    runs-on: windows-2025-vs2026
    env:
      POWERSHELL_TELEMETRY_OPTOUT: 1
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install Vulkan SDK with spirv-tools
        run: |-
          Invoke-WebRequest -Uri "https://sdk.lunarg.com/sdk/download/latest/windows/vulkan-sdk.exe" -OutFile "vulkan-sdk.exe"
          Start-Process -FilePath "vulkan-sdk.exe" -ArgumentList "--accept-licenses", "--default-answer", "--confirm-command", "install" -NoNewWindow -Wait
          $env:VULKAN_SDK = "C:\VulkanSDK\$(Get-ChildItem -Path 'C:\VulkanSDK' -Directory | Select-Object -First 1 -ExpandProperty Name)"
          echo "VULKAN_SDK=$env:VULKAN_SDK" >> $env:GITHUB_ENV
          echo "${env:VULKAN_SDK}\Bin" >> $env:GITHUB_PATH

      - name: Download submodules
        run: |-
          $SUBMODULES=(Select-String -CaseSensitive '(?<=path = )(?!third_party\/xbyak_aarch64).+' .gitmodules).Matches.Value
          git submodule update --init --depth=1 -j $env:NUMBER_OF_PROCESSORS $SUBMODULES

      - name: Build xenia-kernel-tests and run the [apc] cases
        run: python xenia-build.py test --config=Release --target=xenia-kernel-tests -- "[apc]" --success --reporter compact

      - name: Whole kernel suite (informational)
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: python xenia-build.py test --config=Release --no_build --target=xenia-kernel-tests

  linux:
    name: Linux kernel tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup build environment
        run: |-
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc
          sudo apt-add-repository "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-20 main"
          sudo apt-get -y update
          sudo apt-get -y install mesa-vulkan-drivers valgrind libc++-dev libc++abi-dev libgtk-3-dev libudev-dev libasound2-dev libpulse-dev libpipewire-0.3-dev libvulkan-dev libx11-xcb-dev clang-20 lld-20 spirv-tools libfuse2
          sudo update-alternatives --install /usr/bin/clang      clang      /usr/bin/clang-20      200
          sudo update-alternatives --install /usr/bin/clang++    clang++    /usr/bin/clang++-20    200
          sudo update-alternatives --install /usr/bin/lld        lld        /usr/bin/lld-20        200
          sudo update-alternatives --install /usr/bin/ld.lld     ld.lld     /usr/bin/ld.lld-20     200
          sudo update-alternatives --install /usr/bin/llvm-ar    llvm-ar    /usr/bin/llvm-ar-20    200
          sudo update-alternatives --install /usr/bin/llvm-ranlib llvm-ranlib /usr/bin/llvm-ranlib-20 200
          sudo update-alternatives --install /usr/bin/llvm-nm    llvm-nm    /usr/bin/llvm-nm-20    200

      - name: Install Vulkan SDK
        run: |-
          wget -qO vulkan-sdk.tar.xz https://sdk.lunarg.com/sdk/download/latest/linux/vulkan-sdk.tar.xz
          mkdir -p ~/vulkan-sdk
          tar -xf vulkan-sdk.tar.xz -C ~/vulkan-sdk
          VULKAN_SDK_VERSION=$(ls ~/vulkan-sdk)
          echo "VULKAN_SDK=${HOME}/vulkan-sdk/${VULKAN_SDK_VERSION}/x86_64" >> $GITHUB_ENV
          echo "${HOME}/vulkan-sdk/${VULKAN_SDK_VERSION}/x86_64/bin" >> $GITHUB_PATH

      - name: Download submodules
        run: |-
          SUBMODULES=$(grep -oP '(?<=path = )(?!third_party\/(?:DirectX(?:-Headers|ShaderCompiler)|xbyak_aarch64)).+' .gitmodules)
          git submodule update --init --depth=1 -j$(getconf _NPROCESSORS_ONLN) $SUBMODULES

      - name: Build xenia-kernel-tests and run the [apc] cases
        env:
          CC: clang-20
          CXX: clang++-20
        run: ./xenia-build.py test --config=Release --target=xenia-kernel-tests -- "[apc]" --success --reporter compact

      - name: Whole kernel suite (informational)
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: ./xenia-build.py test --config=Release --no_build --target=xenia-kernel-tests
